<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>照片墙 | Photo Wall</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-github-owner="woshichenghaibo" data-github-repo="gallary" data-images-path="images">
    <header class="site-header">
      <h1>📷 我的照片墙</h1>
      <p>记录生活中的美好瞬间</p>
    </header>

    <main>
      <section id="gallery" class="gallery" aria-live="polite"></section>
      <nav class="pagination" id="pagination" aria-label="图片分页"></nav>
    </main>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-labelledby="lightbox-title" aria-hidden="true">
      <h2 id="lightbox-title" class="sr-only">图片预览</h2>
      <button type="button" class="close-btn" aria-label="关闭预览">&times;</button>
      <button type="button" class="nav-btn prev-btn" aria-label="上一张">&#10094;</button>
      <img class="lightbox-img" id="lightbox-img" src="" alt="大图预览" />
      <button type="button" class="nav-btn next-btn" aria-label="下一张">&#10095;</button>
    </div>

    <footer class="site-footer">
      <p>&copy; <span id="year"></span> Photo Wall. Powered by GitHub Pages.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
